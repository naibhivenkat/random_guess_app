plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.randomguess'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.randomguess"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:23.0.0'
}
